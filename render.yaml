services:
  - type: web
    name: mlops-anomaly-detection-platform
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SERVICE_NAME
        value: mlops-anomaly-detection
      - key: DEBUG
        value: "false"
